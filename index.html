<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lavastoviglie">
<title>Lavastoviglie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍽️%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg1:#0b1f33; --bg2:#103251;
    --card:#14385a; --card2:#184266; --line:#245478;
    --text:#eaf6fb; --muted:#8fb3c9;
    --accent:#3ec7e0; --ok:#5fe0a8; --warn:#ffd166; --danger:#ff7a6b;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:#103251}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:radial-gradient(1200px 600px at 80% -10%,#1a4a73 0%,transparent 60%),
               linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    padding:max(14px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  }
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:1.45rem;margin:0;display:flex;align-items:center;gap:8px}
  .ver{font-size:.75rem;color:var(--muted);border:1px solid var(--line);
       padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.04);white-space:nowrap}
  .now{color:var(--muted);font-size:.95rem;margin:-6px 0 14px}

  /* Program grid */
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  .prog{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid var(--line);border-left:6px solid var(--c);
    border-radius:var(--radius);padding:14px 16px;
    transition:transform .12s, box-shadow .12s;
  }
  .prog:active{transform:scale(.98)}
  .prog:hover{box-shadow:0 0 0 2px var(--c) inset}
  .prog .ic{font-size:2rem;width:52px;height:52px;display:grid;place-items:center;
            border-radius:14px;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
  .prog .info{flex:1;min-width:0}
  .prog .name{font-weight:700;font-size:1.1rem}
  .prog .temp{color:var(--c);font-weight:700;margin-left:4px}
  .prog .desc{color:var(--muted);font-size:.85rem;margin-top:2px}
  .prog .right{text-align:right;flex:none}
  .prog .dur{font-weight:800;font-size:1.25rem}
  .prog .end{color:var(--muted);font-size:.8rem;margin-top:2px}
  .prog[disabled]{opacity:.5;pointer-events:none}
  .prog.test{background:transparent;border-style:dashed;border-left-style:solid}

  /* Running view */
  .run{display:none;text-align:center;
       background:linear-gradient(160deg,var(--card2),var(--card));
       border:1px solid var(--line);border-radius:24px;padding:22px 16px 20px}
  .run .pname{font-size:1.2rem;font-weight:700}
  .run .pname span{color:var(--c)}
  .ringbox{position:relative;width:min(70vw,300px);aspect-ratio:1;margin:16px auto}
  .ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ringbox .center{position:absolute;inset:0;display:grid;place-content:center}
  .left{font-size:clamp(2.2rem,11vw,3.4rem);font-weight:800;font-variant-numeric:tabular-nums}
  .leftlbl{color:var(--muted);font-size:.9rem}
  .endbig{font-size:1.3rem;margin:4px 0 16px}
  .endbig b{color:var(--accent)}
  .started{color:var(--muted);font-size:.85rem;margin-bottom:16px}
  .btn{all:unset;cursor:pointer;display:inline-block;padding:14px 26px;border-radius:14px;
       font-weight:700;font-size:1.05rem;text-align:center}
  .btn.cancel{background:transparent;border:2px solid var(--danger);color:var(--danger)}
  .btn.cancel.armed{background:var(--danger);color:#2a0f0b}
  .btn.done{background:var(--ok);color:#06261a}
  .btn.small{padding:9px 14px;font-size:.85rem;border:1px solid var(--line);color:var(--text);border-radius:12px}
  .finished .left{color:var(--ok)}

  /* Footer */
  .foot{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;
        display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
        color:var(--muted);font-size:.85rem}
  .foot code{color:var(--text);background:rgba(255,255,255,.06);padding:3px 7px;border-radius:7px;user-select:all}
  .cards{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  @media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
  @media (min-width:1000px){.cards{grid-template-columns:1fr 1fr 1fr}}
  body.big .cards{grid-template-columns:1fr 1fr 1fr}
  .refill{margin-bottom:12px}
  .refill .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .refill .lbl{font-weight:700}
  .refill .cnt{color:var(--muted);font-size:.85rem}
  .refill.warn .cnt{color:var(--warn);font-weight:700}
  .refill .bar{margin:6px 0 0}
  .refill.warn .bar i{background:var(--warn)}
  .prog .src{font-size:.7rem;color:var(--ok)}
  .btn.ok{background:transparent;border:2px solid var(--ok);color:var(--ok);margin-left:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
        border-radius:var(--radius);padding:14px 16px}
  .card h2{font-size:1rem;margin:0 0 10px;color:var(--muted);font-weight:600}
  .pills{display:flex;align-items:baseline;gap:8px}
  .pills .num{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
  .pills.low .num{color:var(--warn)} .pills.out .num{color:var(--danger)}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 12px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
  .pills.low ~ .bar i{background:var(--warn)} .pills.out ~ .bar i{background:var(--danger)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row input{width:90px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);
             background:rgba(255,255,255,.06);color:var(--text);font-size:1rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
  .stats b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
  .stats span{color:var(--muted);font-size:.75rem}
  .sub{color:var(--muted);font-size:.8rem;margin:10px 0 6px}
  .btn.small.warn{border-color:var(--warn);color:var(--warn)}
  .modal{position:fixed;inset:0;background:rgba(3,12,22,.72);display:none;place-items:center;z-index:20;padding:20px}
  .modal.show{display:grid}
  body.big .modal .box{zoom:1.6}
  .modal .box{background:linear-gradient(160deg,var(--card2),var(--card));border:2px solid var(--warn);
              border-radius:22px;padding:24px 22px;max-width:420px;width:100%;text-align:center;
              box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal .big{font-size:3rem;line-height:1}
  .modal h3{margin:10px 0 6px;font-size:1.35rem}
  .modal p{color:var(--muted);margin:0 0 18px}
  .modal .btn{background:var(--warn);color:#2b2000}
  .note{color:var(--muted);font-size:.78rem;text-align:center;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
         background:#0d2740;border:1px solid var(--line);color:var(--text);padding:12px 18px;
         border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .25s;
         max-width:90vw;text-align:center;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger)}

  /* Echo Show 15 / big screens: everything a bit larger */
  /* Schermo grande (Echo Show): 2 colonne più larghe; lo zoom lo fa fitScreen() */
  body.big .grid{grid-template-columns:repeat(2,1fr);gap:16px}
  body.big .prog{padding:26px 20px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <h1>🍽️ Lavastoviglie</h1>
    <span class="ver" id="ver"></span>
  </header>
  <div class="now" id="now"></div>

  <!-- Scelta programma -->
  <section id="pick">
    <div class="grid" id="grid"></div>
  </section>

  <!-- Programma in corso -->
  <section class="run" id="run">
    <div class="pname" id="rName"></div>
    <div class="ringbox">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0"/>
      </svg>
      <div class="center">
        <div class="left" id="rLeft">--:--</div>
        <div class="leftlbl" id="rLbl">rimanenti</div>
      </div>
    </div>
    <div class="endbig" id="rEnd"></div>
    <div class="started" id="rStart"></div>
    <div class="btns">
      <button class="btn cancel" id="bCancel">✖ Annulla</button>
      <button class="btn ok" id="bEarly" style="display:none">✔ Ha già finito</button>
      <button class="btn done" id="bDone" style="display:none">✔ Svuotata</button>
    </div>
  </section>

  <div class="cards">
    <div class="card" id="cPills">
      <h2>💊 Pastiglie</h2>
      <div class="pills" id="pills"><span class="num" id="pNum">–</span><span id="pTxt" class="leftlbl">rimaste</span></div>
      <div class="bar"><i id="pBar" style="width:0%"></i></div>
      <div class="row">
        <button class="btn small" id="bBox">📦 Scatolo nuovo</button>
        <button class="btn small" id="bFix">✏️ Correggi</button>
        <span class="row" id="fixRow" style="display:none">
          <input type="number" id="fixVal" min="0" max="999" inputmode="numeric" placeholder="n°">
          <button class="btn small" id="bFixOk">OK</button>
        </span>
      </div>
    </div>
    <div class="card" id="cRefill">
      <h2>🧂 Brillantante e sale</h2>
      <div class="refill" id="rfBrill">
        <div class="top"><span class="lbl">✨ Brillantante</span><button class="btn small" data-refill="brillantante">Ricaricato</button></div>
        <div class="cnt"></div><div class="bar"><i style="width:0%"></i></div>
      </div>
      <div class="refill" id="rfSale">
        <div class="top"><span class="lbl">🧂 Sale</span><button class="btn small" data-refill="sale">Ricaricato</button></div>
        <div class="cnt"></div><div class="bar"><i style="width:0%"></i></div>
      </div>
    </div>
    <div class="card" id="cStats">
      <h2>📊 Statistiche</h2>
      <div class="sub" style="margin-top:0">Questo mese</div>
      <div class="stats" id="sMonth"></div>
      <div class="sub">Da sempre</div>
      <div class="stats" id="sAll"></div>
      <div class="sub" id="sFav"></div>
    </div>
  </div>

  <div class="foot">
    <span>📣 Canale notifiche ntfy: <code id="topic"></code></span>
    <button class="btn small" id="bTest">🔔 Prova notifica</button>
  </div>
  <div class="note">Durate dal libretto. Se finisce prima, tocca "Ha già finito": l'app impara solo gli anticipi.</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="pillModal">
  <div class="box">
    <div class="big">💊🛒</div>
    <h3 id="pmTitle">Pastiglie quasi finite!</h3>
    <p id="pmText"></p>
    <button class="btn" id="pmOk">Ok, le compro!</button>
  </div>
</div>

<script>
const VERSION = 'v1.8';
const TOPIC   = 'lavastoviglie-ste-8ngizkhq';   // stesso nome da mettere nell'app ntfy
const NTFY    = 'https://ntfy.sh';
const STATE_TOPIC = TOPIC + '-stato';         // canale "muto" solo per sincronizzare le pagine (nessuna notifica)

function publishState(obj){
  fetch(`${NTFY}/${STATE_TOPIC}`, {method:'POST', body:JSON.stringify(obj)}).catch(()=>{});
}

// Programmi dal libretto (minuti)
const PROGS = [
  {k:'misti', n:'Misti',             t:'55°', m:145, kwh:1.35, litri:16, i:'🍽️', c:'#3ec7e0', d:'Sporco normale e residui secchi'},
  {k:'eco',   n:'Eco',               t:'50°', m:270, kwh:0.95, litri:12, i:'🌿', c:'#5fe0a8', d:'Mediamente sporche, risparmio'},
  {k:'int',   n:'Intensivo',         t:'65°', m:150, kwh:1.5, litri:16, i:'🔥', c:'#ff9a6b', d:'Pentole molto sporche'},
  {k:'push',  n:'Push&GO',           t:'50°', m:85, kwh:1.1, litri:11.5,  i:'▶️', c:'#b69cff', d:'Quotidiano, lava e asciuga'},
  {k:'fast',  n:"Fast&Clean 28'",    t:'45°', m:28, kwh:0.6, litri:9,  i:'⚡', c:'#ffd166', d:'Mezzo carico, senza asciugatura'},
  {k:'prova', n:'PROVA',             t:"2'",  m:2, kwh:0, litri:0,   i:'🧪', c:'#8fb3c9', d:'Timer di prova: notifica dopo 2 minuti', test:true},
];
const byKey = k => PROGS.find(p => p.k === k);

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const hhmm = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const durTxt = m => m >= 60 ? `${Math.floor(m/60)}h ${pad(m%60)}'` : `${m}'`;

// ---- stato locale (sopravvive a ricarica pagina) ----
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let state = store.get('lava_state');          // {k, start, end, seq}
let busy = false;

function toast(msg, err){
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err?' err':'');
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.className = 'toast', 3500);
}

// ---- interfaccia ----
function buildGrid(){
  $('grid').innerHTML = PROGS.map(p => `
    <button class="prog${p.test?' test':''}" style="--c:${p.c}" data-k="${p.k}">
      <div class="ic">${p.i}</div>
      <div class="info">
        <div class="name">${p.n}<span class="temp">${p.t}</span></div>
        <div class="desc">${p.d}</div>
      </div>
      <div class="right">
        <div class="dur" data-dur="${p.k}">${durTxt(p.m)}</div>
        <div class="src" data-src="${p.k}"></div>
        <div class="end" data-end="${p.k}"></div>
      </div>
    </button>`).join('');
  $('grid').querySelectorAll('.prog').forEach(b => b.onclick = () => startProg(byKey(b.dataset.k)));
}

function render(){
  const now = Date.now();
  $('now').textContent = 'Ora: ' + hhmm(now);
  // anteprima orario di fine su ogni programma
  document.querySelectorAll('[data-end]').forEach(el => {
    el.textContent = 'fine ≈ ' + hhmm(now + durOf(byKey(el.dataset.end)).m*60000);
  });
  document.querySelectorAll('[data-dur]').forEach(el => {
    const d = durOf(byKey(el.dataset.dur));
    el.textContent = durTxt(d.m);
    el.nextElementSibling.textContent = d.n ? `⏱️ misurata (${d.n}×)` : '';
  });

  const view = state ? 'run' : 'pick';
  if (view !== lastView){ lastView = view; requestAnimationFrame(fitScreen); }

  if (!state){ $('pick').style.display=''; $('run').style.display='none'; return; }

  const p = byKey(state.k) || {n:'Programma',t:'',c:'#3ec7e0'};
  $('pick').style.display='none'; $('run').style.display='block';
  $('run').style.setProperty('--c', p.c);
  $('ring').style.stroke = p.c;
  $('rName').innerHTML = `${p.i||''} ${p.n} <span>${p.t}</span>`;
  $('rStart').textContent = 'Avviata alle ' + hhmm(state.start);

  const total = state.end - state.start;
  const left  = Math.max(0, state.end - now);
  $('ring').style.strokeDashoffset = (326.73 * (1 - left/total)).toFixed(2);

  if (left > 0){
    $('run').classList.remove('finished');
    const s = Math.ceil(left/1000), h = Math.floor(s/3600), mi = Math.floor(s%3600/60), se = s%60;
    $('rLeft').textContent = h ? `${h}:${pad(mi)}:${pad(se)}` : `${pad(mi)}:${pad(se)}`;
    $('rLbl').textContent = 'rimanenti';
    $('rEnd').innerHTML = `Finisce alle <b>${hhmm(state.end)}</b> circa`;
    $('bCancel').style.display=''; $('bDone').style.display='none';
    $('bEarly').style.display = (!p.test && (now - state.start) > total*0.4) ? '' : 'none';
  } else {
    $('run').classList.add('finished');
    $('rLeft').textContent = 'Finita! 🎉';
    $('rLbl').textContent = '';
    $('rEnd').innerHTML = `Terminata alle <b>${hhmm(state.end)}</b>`;
    $('bCancel').style.display='none'; $('bDone').style.display=''; $('bEarly').style.display='none';
    // dopo 3 ore sparisce da sola
    if (now - state.end > 3*3600000) clearState(true);
  }
}

// ---- Echo Show / schermi grandi: ingrandisce tutto per riempire lo schermo ----
let lastView = null;
function fitScreen(){
  const w = $('wrap');
  w.style.zoom = 1;
  const W = window.innerWidth, H = window.innerHeight;
  const big = W >= 1000 && W > H;
  document.body.classList.toggle('big', big);
  if (!big) return;                 // telefoni e tablet in verticale: niente zoom
  const s = Math.min((W * 0.94) / w.offsetWidth, (H * 0.92) / w.offsetHeight);
  w.style.zoom = Math.max(1, Math.min(s, 2.6)).toFixed(3);
}
window.addEventListener('resize', fitScreen);

function setState(s){ state = s; store.set('lava_state', s); render(); }
function clearState(dismiss){
  if (dismiss && state) store.set('lava_dismissed', state.seq);
  state = null; store.del('lava_state'); render();
}

// ---- ntfy ----
async function startProg(p){
  if (busy) return; busy = true;
  document.querySelectorAll('.prog').forEach(b => b.disabled = true);
  const start  = Date.now();
  const endSec = Math.round((start + durOf(p).m*60000)/1000);
  const seq    = `lava-${p.k}-${endSec}`;
  const q = new URLSearchParams({
    title: `🍽️ ${p.n} ${p.t} finito!`,
    delay: String(endSec),
    priority: '4',
    tags: 'tada'
  });
  const msg = `Lavastoviglie pronta da svuotare (programma ${p.n} ${p.t}, avviato alle ${hhmm(start)})`;
  try{
    const r = await fetch(`${NTFY}/${TOPIC}/${seq}?${q}`, {method:'POST', body:msg});
    if (!r.ok) throw new Error('HTTP '+r.status);
    setState({k:p.k, start, end:endSec*1000, seq});
    publishState({a:'start', k:p.k, start, end:endSec*1000, seq});
    logStart(p, start, endSec*1000, seq);
    toast(`✅ Avviata! Notifica alle ${hhmm(endSec*1000)}`);
  }catch(e){
    toast('⚠️ Notifica NON programmata: controlla la connessione e riprova', true);
  }finally{
    busy = false;
    document.querySelectorAll('.prog').forEach(b => b.disabled = false);
  }
}

let armTimer;
$('bCancel').onclick = async () => {
  const b = $('bCancel');
  if (!b.classList.contains('armed')){
    b.classList.add('armed'); b.textContent = 'Sicuro? Tocca di nuovo';
    clearTimeout(armTimer);
    armTimer = setTimeout(()=>{ b.classList.remove('armed'); b.textContent='✖ Annulla'; }, 4000);
    return;
  }
  clearTimeout(armTimer); b.classList.remove('armed'); b.textContent='✖ Annulla';
  if (!state) return;
  try{
    const r = await fetch(`${NTFY}/${TOPIC}/${state.seq}/delete`);
    if (!r.ok) throw new Error('HTTP '+r.status);
    publishState({a:'cancel', seq:state.seq});
    api({action:'cancel', seq:state.seq}).catch(()=>{});
    clearState(true);
    toast('🗑️ Annullata: nessuna notifica partirà');
  }catch(e){
    toast('⚠️ Non riesco ad annullare la notifica: riprova', true);
  }
};

$('bDone').onclick = () => { if (state) publishState({a:'done', seq:state.seq}); clearState(true); toast('👍 Pronta per il prossimo giro'); };

$('bTest').onclick = async () => {
  try{
    const q = new URLSearchParams({title:'Prova lavastoviglie 🔔', tags:'bell'});
    const r = await fetch(`${NTFY}/${TOPIC}?${q}`, {method:'POST', body:'Se leggi questo, le notifiche funzionano!'});
    if (!r.ok) throw new Error();
    toast('🔔 Inviata! Dovrebbe arrivare su tutti i telefoni');
  }catch(e){ toast('⚠️ Invio fallito', true); }
};

// ---- sincronizzazione tra dispositivi (telefono, iPhone, Echo) ----
async function sync(){
  try{
    const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&sched=1&since=12h`);
    if (!r.ok) return;
    const lines = (await r.text()).trim().split('\n').filter(Boolean);
    const seen = {}, deleted = {};
    try{
      const r2 = await fetch(`${NTFY}/${STATE_TOPIC}/json?poll=1&since=12h`);
      if (r2.ok) for (const l of (await r2.text()).trim().split('\n').filter(Boolean)){
        try{ const a = JSON.parse(JSON.parse(l).message || '{}');
             if (a.a === 'cancel' || a.a === 'done') deleted[a.seq] = true; }catch(e){}
      }
    }catch(e){}
    for (const l of lines){
      let ev; try{ ev = JSON.parse(l); }catch(e){ continue; }
      const sid = ev.sequence_id || '';
      if (!sid.startsWith('lava-')) continue;
      if (ev.event === 'message_delete') deleted[sid] = true;
      else if (ev.event === 'message') seen[sid] = true;
    }
    // annullata da un altro dispositivo?
    if (state && deleted[state.seq]) { clearState(false); return; }
    // c'è un giro avviato altrove?
    const dismissed = store.get('lava_dismissed');
    let best = null;
    for (const sid of Object.keys(seen)){
      if (deleted[sid] || sid === dismissed) continue;
      const [, k, es] = sid.split('-'); const end = +es*1000; const p = byKey(k);
      if (!p || !end) continue;
      if (Date.now() - end > 3*3600000) continue;
      if (!best || end > best.end) best = {k, end, start:end - p.m*60000, seq:sid};
    }
    if (best && (!state || best.end > state.end)) setState(best);
  }catch(e){ /* offline: resta lo stato locale */ }
}

// ---- tempo reale: appena un altro dispositivo avvia/annulla, questa pagina si aggiorna ----
function applyAction(a){
  if (!a || !a.a) return;
  setTimeout(refreshArchive, 4000);
  if (a.a === 'end'){
    if (state && state.seq === a.seq) setState(Object.assign({}, state, {end:a.end, real:true}));
    return;
  }
  if (a.a === 'start'){
    if (a.seq === store.get('lava_dismissed')) return;
    if (!state || state.seq !== a.seq){ setState({k:a.k, start:a.start, end:a.end, seq:a.seq}); toast('📲 Avviata da un altro dispositivo'); }
  } else if ((a.a === 'cancel' || a.a === 'done') && state && state.seq === a.seq){
    clearState(true);
    toast(a.a === 'cancel' ? '🗑️ Annullata da un altro dispositivo' : '👍 Svuotata');
  }
}
function live(){
  try{
    const es = new EventSource(`${NTFY}/${STATE_TOPIC}/sse`);
    es.onmessage = e => {
      try{ const ev = JSON.parse(e.data); if (ev.event === 'message') applyAction(JSON.parse(ev.message)); }catch(err){}
    };
  }catch(e){}
}

// ---- archivio Google Foglio: statistiche e pastiglie ----
const SHEET_API = 'https://script.google.com/macros/s/AKfycbw-eV_KPo_0tkgfkfYEcQOgE6Z-el2fwAylNx7UqYnS2RTmPwozC3CYCKT5WjmJQLUG/exec';   // indirizzo dell'App web Apps Script (da incollare dopo la pubblicazione)
let archive = store.get('lava_archive');

async function api(params){
  if (!SHEET_API) throw new Error('nocfg');
  const r = await fetch(`${SHEET_API}?${new URLSearchParams(params)}`);
  const j = await r.json();
  if (!j.ok) throw new Error('bad');
  archive = j; store.set('lava_archive', j); renderArchive();
  return j;
}
const refreshArchive = () => api({action:'read'}).catch(()=>{});

function pillsLeft(a){
  if (!a || !a.pastiglie.length) return null;
  const last = a.pastiglie.reduce((x,y) => (y.t > x.t ? y : x));
  const used = a.lavaggi.filter(l => l.t > last.t && l.stato !== 'annullato' && l.prog !== 'PROVA').length;
  return Math.max(0, last.qty - used);
}

function statBox(list, prezzo){
  const kwh = list.reduce((s,l)=>s+(+l.kwh||0),0), lt = list.reduce((s,l)=>s+(+l.litri||0),0);
  const f = (n,d) => n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
  return `<div><b>${list.length}</b><span>lavaggi</span></div>
          <div><b>${f(kwh,1)}</b><span>kWh</span></div>
          <div><b>${f(lt,0)}</b><span>litri</span></div>
          <div><b>${f(kwh*prezzo,2)} €</b><span>luce</span></div>`;
}

function renderArchive(){
  if (!SHEET_API){ $('pTxt').textContent = 'archivio da collegare'; $('sFav').textContent = 'Archivio Google non ancora collegato'; }
  if (!archive) return;
  const left = pillsLeft(archive), per = archive.perScatolo || 88, soglia = archive.soglia || 5;
  const pills = $('pills');
  pills.classList.toggle('low', left !== null && left <= soglia && left > 0);
  pills.classList.toggle('out', left === 0);
  $('pNum').textContent = left === null ? '–' : left;
  $('pTxt').textContent = left === null ? 'tocca "Scatolo nuovo" per iniziare' :
                          left === 0 ? 'finite! 🛒' : left <= soglia ? 'rimaste: da ricomprare! 🛒' : `rimaste su ${per}`;
  checkPillPopup(left, soglia);
  renderRefill(); render();
  $('pBar').style.width = left === null ? '0%' : Math.min(100, left/per*100) + '%';

  const valid = archive.lavaggi.filter(l => l.stato !== 'annullato' && l.prog !== 'PROVA' && l.t);
  const d = new Date(), m0 = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  $('sMonth').innerHTML = statBox(valid.filter(l => l.t >= m0), archive.prezzo);
  $('sAll').innerHTML   = statBox(valid, archive.prezzo);
  const cnt = {}; valid.forEach(l => cnt[l.prog] = (cnt[l.prog]||0)+1);
  const fav = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $('sFav').textContent = fav ? `⭐ Programma più usato: ${fav[0]} (${fav[1]} volte)` : 'Ancora nessun lavaggio registrato';
}

// Pop-up quando le pastiglie scendono sotto la soglia (una volta per ogni numero)
function checkPillPopup(left, soglia){
  if (left === null || left > soglia){ store.del('lava_pill_seen'); return; }
  const seen = store.get('lava_pill_seen');
  if (seen !== null && seen !== undefined && left >= seen) return;
  $('pmTitle').textContent = left === 0 ? 'Pastiglie finite!' : 'Pastiglie quasi finite!';
  $('pmText').textContent = left === 0 ? 'Non ne è rimasta nessuna: da ricomprare subito.'
                          : `Ne ${left === 1 ? 'resta solo 1' : 'restano solo ' + left}. Mettile nella lista della spesa!`;
  $('pillModal').classList.add('show');
  $('pmOk').onclick = () => { store.set('lava_pill_seen', left); $('pillModal').classList.remove('show'); };
}

// ---- durate imparate: mediana delle ultime 5 durate reali di quel programma ----
function durOf(p){
  if (!p) return {m:0, n:0};
  if (p.test || !archive) return {m:p.m, n:0};
  // si impara solo l'anticipo: durate più lunghe del libretto vengono ignorate
  const reals = archive.lavaggi.filter(l => l.prog === p.n && l.reale > 0 && l.reale < p.m && l.stato !== 'annullato')
                               .sort((a,b) => b.t - a.t).slice(0,5).map(l => l.reale).sort((a,b)=>a-b);
  if (!reals.length) return {m:p.m, n:0};
  const mid = reals.length >> 1;
  const med = reals.length % 2 ? reals[mid] : (reals[mid-1] + reals[mid]) / 2;
  return {m: Math.round(med), n: reals.length};
}

async function markReal(early){
  if (!state) return;
  const now = Date.now(), min = Math.round((now - state.start)/60000);
  if (early) fetch(`${NTFY}/${TOPIC}/${state.seq}/delete`).catch(()=>{});   // niente notifica in ritardo
  publishState({a:'end', seq:state.seq, end: early ? now : state.end});
  setState(Object.assign({}, state, early ? {end:now, real:true} : {real:true}));
  try{ await api({action:'real', seq:state.seq, min}); toast(`⏱️ Durata reale salvata: ${durTxt(min)}`); }
  catch(e){ toast('⚠️ Durata non salvata nell\'archivio', true); }
}
$('bEarly').onclick = () => markReal(true);

// ---- brillantante e sale ----
function sinceRefill(a, tipo){
  const last = a.ricariche.filter(r => r.tipo === tipo).reduce((m,r) => Math.max(m, r.t), 0);
  if (!last) return null;
  return a.lavaggi.filter(l => l.t > last && l.stato !== 'annullato' && l.prog !== 'PROVA').length;
}
function renderRefill(){
  if (!archive || !archive.ricariche) return;
  [['brillantante','rfBrill',archive.ogniBrillantante],['sale','rfSale',archive.ogniSale]].forEach(([tipo,id,ogni]) => {
    const el = $(id), n = sinceRefill(archive, tipo);
    el.classList.toggle('warn', n !== null && n >= ogni);
    el.querySelector('.cnt').textContent = n === null ? 'Tocca "Ricaricato" quando lo riempi'
      : n >= ogni ? `${n} lavaggi: da controllare! (ogni ${ogni})` : `${n} lavaggi su ${ogni}`;
    el.querySelector('.bar i').style.width = n === null ? '0%' : Math.min(100, n/ogni*100) + '%';
  });
}
document.querySelectorAll('[data-refill]').forEach(b => b.onclick = async () => {
  const tipo = b.dataset.refill;
  if (!b.classList.contains('warn')){
    b.classList.add('warn'); b.textContent = 'Sicuro?';
    setTimeout(()=>{ b.classList.remove('warn'); b.textContent='Ricaricato'; }, 4000);
    return;
  }
  b.classList.remove('warn'); b.textContent='Ricaricato';
  try{ await api({action:'refill', tipo}); toast(tipo === 'sale' ? '🧂 Sale ricaricato!' : '✨ Brillantante ricaricato!'); }
  catch(e){ toast('⚠️ Non riesco a salvare: riprova', true); }
});

let boxArm;
$('bBox').onclick = async () => {
  const b = $('bBox');
  if (!b.classList.contains('warn')){
    b.classList.add('warn'); b.textContent = 'Sicuro? Tocca di nuovo';
    clearTimeout(boxArm); boxArm = setTimeout(()=>{ b.classList.remove('warn'); b.textContent='📦 Scatolo nuovo'; }, 4000);
    return;
  }
  clearTimeout(boxArm); b.classList.remove('warn'); b.textContent='📦 Scatolo nuovo';
  try{ await api({action:'box', tipo:'nuovo', qty:(archive && archive.perScatolo) || 88}); toast('📦 Scatolo nuovo registrato!'); }
  catch(e){ toast(e.message==='nocfg' ? '⚠️ Archivio Google non ancora collegato' : '⚠️ Non riesco a salvare: riprova', true); }
};
$('bFix').onclick = () => { const r = $('fixRow'); r.style.display = r.style.display ? '' : 'none'; $('fixVal').focus(); };
$('bFixOk').onclick = async () => {
  const v = parseInt($('fixVal').value, 10);
  if (isNaN(v) || v < 0) { toast('Scrivi quante pastiglie ci sono adesso', true); return; }
  try{ await api({action:'box', tipo:'correzione', qty:v}); $('fixRow').style.display='none'; $('fixVal').value=''; toast(`✏️ Ok, ${v} pastiglie`); }
  catch(e){ toast(e.message==='nocfg' ? '⚠️ Archivio Google non ancora collegato' : '⚠️ Non riesco a salvare: riprova', true); }
};

async function logStart(p, start, end, seq){
  try{
    const a = await api({action:'start', seq, start, prog:p.n, temp:p.t, min:p.m, kwh:p.kwh, litri:p.litri});
    const left = pillsLeft(a);
    if (!p.test && left !== null && left <= (a.soglia||5)){
      const q = new URLSearchParams({title:'💊 Pastiglie quasi finite', tags:'shopping_cart'});
      fetch(`${NTFY}/${TOPIC}?${q}`, {method:'POST', body: left === 0 ? 'Pastiglie finite: da ricomprare!' : `Restano solo ${left} pastiglie: mettile nella lista della spesa 🛒`}).catch(()=>{});
    }
    if (!p.test && a.ricariche){
      const due = [];
      const nb = sinceRefill(a,'brillantante'), ns = sinceRefill(a,'sale');
      if (nb !== null && nb >= a.ogniBrillantante) due.push('il brillantante ✨');
      if (ns !== null && ns >= a.ogniSale) due.push('il sale 🧂');
      if (due.length){
        const q2 = new URLSearchParams({title:'🧂 Controlla la lavastoviglie', tags:'salt'});
        fetch(`${NTFY}/${TOPIC}?${q2}`, {method:'POST', body:`È ora di controllare ${due.join(' e ')}. Quando ricarichi, tocca "Ricaricato" nell'app.`}).catch(()=>{});
      }
    }
  }catch(e){}
}
